[workspace]
resolver = "2"
members = [
    "crates/speakeasy-core",
    "crates/speakeasy-models",
    "crates/speakeasy-platform",
    "crates/speakeasy-whisper",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Single place to pin versions. See README "Unverified versions" before first build.
[workspace.dependencies]
speakeasy-core = { path = "crates/speakeasy-core" }
speakeasy-models = { path = "crates/speakeasy-models" }
speakeasy-platform = { path = "crates/speakeasy-platform" }
speakeasy-whisper = { path = "crates/speakeasy-whisper" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verifying downloaded model files. Hashing is not a network stack, so this
# does not compromise speakeasy-core's "portable, no OS APIs" invariant.
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cpal = "0.15"
rubato = "0.15"
# Already in the tree via rubato; named here because the spectrum display uses
# it directly rather than by accident.
realfft = "3"
whisper-rs = "0.16"
# Model downloads. Blocking by design — the ModelFetcher port's contract is
# blocking, so an async runtime would be a dependency with nothing to do.
ureq = "3"

# macos-private-api is required for the transparent status widget.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-build = "2"

x11rb = "0.13"
core-graphics = "0.24"
core-foundation = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
